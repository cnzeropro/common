/*
 * 插件仓库。
 * 作用：独立构建 `common-bom` 时允许从本地和远程仓库解析构建插件。
 */
pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
    }
}

/*
 * 依赖仓库。
 * 作用：独立构建 `common-bom` 时复用主工程解析策略，并仅从 `mavenLocal()` 读取 `org.zero` 产物。
 */
dependencyResolutionManagement {
    repositoriesMode = org.gradle.api.initialization.resolve.RepositoriesMode.PREFER_SETTINGS
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        mavenLocal {
            content {
                includeGroup('org.zero')
            }
        }
        mavenCentral()
    }
}

/*
 * 根项目名称。
 * 作用：保留 `common-bom` 的独立构建入口与发布标识。
 */
rootProject.name = 'common-bom'
