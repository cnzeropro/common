plugins {
    id 'java-platform'
    id 'maven-publish'
}

/*
 * 构建版本。
 * 作用：`common-bom` 独立发布时仍复用根仓库同步出的 `build.revision`。
 */
def revisionProvider = providers.gradleProperty('build.revision')
if (!revisionProvider.isPresent()) {
    throw new GradleException("Missing Gradle property 'build.revision'.")
}
def revision = revisionProvider.get()

group = 'org.zero'
version = revision
description = 'common-bom'
def localStagingRepositoryDirectory = layout.buildDirectory.dir('repos/local-staging')

/*
 * 平台模块。
 * 作用：当前工程只导出版本约束，不生成普通业务 jar。
 */
javaPlatform {
    allowDependencies()
}

dependencies {
    /*
     * 内部坐标约束。
     * 作用：BOM 只管理仓库内公共模块版本，不声明业务实现依赖。
     */
    constraints {
        api "org.zero:common-data:${version}"
        api "org.zero:common-core:${version}"
        api "org.zero:common-api:${version}"
        api "org.zero:common-job:${version}"
    }
}

/*
 * BOM 发布。
 * 作用：将 `common-bom` 单独发布到本地 staging 仓库，供外部工程按坐标引入。
 */
publishing {
    repositories {
        maven {
            name = 'localStagingRepository'
            url = localStagingRepositoryDirectory
        }
    }
    publications {
        mavenBom(MavenPublication) {
            from components.javaPlatform
            artifactId = 'common-bom'
        }
    }
}
