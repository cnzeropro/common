import org.gradle.api.artifacts.VersionCatalogsExtension

plugins {
    id 'org.zero.conventions.java8-library'
}

def baseCatalog = extensions.getByType(VersionCatalogsExtension).named('baseLibs')

def requiredBaseLibrary = { String alias ->
    baseCatalog.findLibrary(alias).orElseThrow {
        new GradleException("Missing catalog alias '${alias}'.")
    }.get()
}

/*
 * 依赖布局。
 * 作用：先继承根平台版本，再声明面向 `common-core` 和 `common-data` 的 API 契约依赖。
 */
dependencies {
    implementation(platform(project(':')))
    implementation(project(':common-core'))

    /*
     * 编译期核心类型。
     * 作用：仅复用 `core-base` 的基础类型，避免核心实现重复进入当前产物。
     */
    compileOnly(project(':core-base'))
    implementation(project(':common-data'))
    implementation('org.springframework.cloud:spring-cloud-openfeign-core')
    implementation('org.slf4j:slf4j-api')
    implementation('com.fasterxml.jackson.core:jackson-databind')
    implementation('com.fasterxml.jackson.datatype:jackson-datatype-jsr310')
    implementation('com.baomidou:mybatis-plus-annotation')
    implementation('io.github.openfeign:feign-core')
    implementation('jakarta.validation:jakarta.validation-api')

    /*
     * Lombok 编译支持。
     * 作用：只在编译期参与代码生成，不进入发布产物。
     */
    compileOnly('org.projectlombok:lombok')
    annotationProcessor(requiredBaseLibrary('org-projectlombok_lombok'))
    testCompileOnly('org.projectlombok:lombok')
    testAnnotationProcessor(requiredBaseLibrary('org-projectlombok_lombok'))
}

description = 'common-api'
