server:
  port: 34567
  error:
    whitelabel:
      enabled: false
  tomcat:
    relaxed-path-chars: "[,],{,}"
    relaxed-query-chars: "[,],{,}"
spring:
  application:
    name: test-demo
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss.SSS
    time-zone: GMT+8:00
    # 可见性配置。默认配置参见：com.fasterxml.jackson.annotation.JsonAutoDetect.Value.DEFAULT
    visibility:
      creator: protected_and_public
  datasource:
    # url: jdbc:h2:file:./data/test
    # url: jdbc:h2:tcp//localhost:8080/data/test
    url: jdbc:h2:mem:test
    username: root
    password: abc123
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
      mode: always
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: true

logging:
  file:
    name: ./logs/app.log

mybatis:
  mapper-locations: classpath:mappers/*xml

management:
  server:
    port: "${random.int[1024,49151]}"
  endpoint:
    health:
      show-details: always
  endpoints:
    jmx:
      exposure:
        include: '*'
    web:
      exposure:
        include: '*'
  observations:
    annotations:
      enabled: true
sys:
  codec:
    encryption-config:
      default:
        enabled: true
        algorithm: AES/CBC/PKCS5Padding
        key: "iMewXIZGhkGQZtMkOLVLug=="
        properties:
          iv: "4Z+Q9Q=="
      "[org.zero.common.test.controller.CodecController.c1]":
        enabled: true
        algorithm: DES
        key: "WIcMQAFnR/3Blvi4S7DU5w=="
    decryption-config:
      default:
        enabled: true
        algorithm: AES/CBC/PKCS5Padding
        key: "iMewXIZGhkGQZtMkOLVLug=="
        properties:
          iv: "4Z+Q9Q=="
      "[org.zero.common.test.controller.CodecController.c1]":
        algorithm: DES
        key: "WIcMQAFnR/3Blvi4S7DU5w=="