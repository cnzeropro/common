import org.gradle.api.tasks.Delete
import org.zero.build.BuildProfileSupport

plugins {
    id('java-platform')
    id('base')
}

/*
 * build profile resolve - 统一解析当前构建 profile，并向子模块暴露结果
 */
def activeBuildProfile = BuildProfileSupport.resolveProfile(rootProject, findProperty('buildProfile'))
ext.activeBuildProfile = activeBuildProfile

/*
 * build.revision guard - 运行期只依赖 Gradle 原生属性
 */
def revisionProvider = providers.gradleProperty('build.revision')
if (!revisionProvider.isPresent()) {
    throw new GradleException("Missing Gradle property 'build.revision'.")
}
def revision = revisionProvider.get()

/*
 * java platform config - root 仅作为 BOM 平台使用
 */
javaPlatform {
    allowDependencies()
}

group = 'org.zero'
version = revision
description = 'Common Project'

/*
 * shared BOM export - 统一导出公共依赖约束，版本由 version catalog / imported BOM 决定
 */
dependencies {
    api(platform(libs.cn.dev33.sa.token.dependencies))
    api(platform(libs.com.alibaba.cloud.spring.cloud.alibaba.dependencies))
    api(platform(libs.com.google.cloud.libraries.bom))
    api(platform(libs.com.huaweicloud.spring.cloud.huawei.bom))
    api(platform(libs.com.querydsl.querydsl.bom))
    api(platform(libs.com.baomidou.mybatis.plus.bom))
    api(platform(libs.com.mybatis.flex.mybatis.flex.dependencies))
    api(platform(libs.com.ctrip.framework.apollo.apollo))
    api(platform(libs.com.oracle.database.jdbc.ojdbc.bom))
    api(platform(libs.org.apache.dubbo.dubbo.bom))
    api(platform(libs.org.apache.shiro.shiro.bom))
    api(platform(libs.org.apache.logging.log4j.log4j.bom))
    api(platform(libs.org.springframework.spring.framework.bom))
    api(platform(libs.org.springframework.boot.spring.boot.dependencies))
    api(platform(libs.org.springframework.cloud.spring.cloud.dependencies))
    api(platform(libs.org.springframework.data.spring.data.bom))
    api(platform(libs.org.springframework.security.spring.security.bom))
    api(platform(libs.org.springframework.integration.spring.integration.bom))
    api(platform(libs.org.springframework.shell.spring.shell.dependencies))
    api(platform(libs.org.springframework.session.spring.session.bom))
    api(platform(libs.org.eclipse.jetty.jetty.bom))
    api(platform(libs.org.slf4j.slf4j.bom))
    api(platform(libs.org.junit.junit.bom))
    api(platform(libs.org.testcontainers.testcontainers.bom))
    api(platform(libs.io.projectreactor.reactor.bom))
    api(platform(libs.io.netty.netty.bom))
    api(platform(libs.io.jsonwebtoken.jjwt.bom))
    api(platform(libs.org.dromara.dynamictp.dynamic.tp.dependencies))
    api(platform(libs.cn.hutool.hutool.bom))
    api(platform(libs.jakarta.platform.jakarta.jakartaee.bom))
}

/*
 * clean task config - 允许 clean 处理符号链接目录
 */
tasks.named('clean', Delete).configure {
    followSymlinks = true
}

/*
 * wrapper version lock - 固定团队统一的 Gradle Wrapper 版本
 */
wrapper {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.ALL
}
