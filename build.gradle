import org.gradle.api.artifacts.VersionCatalogsExtension
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.tasks.Delete

plugins {
    id('java-platform')
    id('base')
    id('maven-publish')
    id('org.zero.conventions.site-publish')
}

def revisionProvider = providers.gradleProperty('build.revision')
if (!revisionProvider.isPresent()) {
    throw new GradleException("Missing Gradle property 'build.revision'.")
}

javaPlatform {
    allowDependencies()
}

group = 'org.zero'
version = revisionProvider.get()
description = 'Common Project'

def libsCatalog = extensions.getByType(VersionCatalogsExtension).named('libs')
def localStagingRepositoryDirectory = layout.buildDirectory.dir('repos/local-staging')

def resolveCatalogBundle = { String alias ->
    libsCatalog.findBundle(alias)
        .map { bundle -> bundle.get().collect { dependency -> dependency } }
        .orElse([])
}

def managedEnforcedPlatforms = resolveCatalogBundle('managed-enforced-platforms')
def managedPlatforms = resolveCatalogBundle('managed-platforms')
def managedConstraints = resolveCatalogBundle('managed-constraints')

dependencies {
    managedEnforcedPlatforms.each { dependencyNotation ->
        api(enforcedPlatform(dependencyNotation))
    }

    managedPlatforms.each { dependencyNotation ->
        api(platform(dependencyNotation))
    }

    constraints {
        managedConstraints.each { dependencyNotation ->
            api(dependencyNotation)
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'localStagingRepository'
            url = localStagingRepositoryDirectory
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.javaPlatform
            artifactId = rootProject.name
            pom {
                name = rootProject.name
                description = project.description
            }
        }
    }
}

tasks.named('clean', Delete).configure {
    followSymlinks = true
}

wrapper {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.ALL
}
