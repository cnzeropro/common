/*
 * 构建 profile 解析。
 * 作用：统一解析当前构建使用的 profile，并向子模块暴露结果。
 */
def activeBuildProfile = BuildProfileSupport.resolveProfile(rootProject, findProperty('buildProfile'))
ext.activeBuildProfile = activeBuildProfile

/*
 * 构建版本属性校验。
 * 作用：确保运行期只依赖 Gradle 原生属性中的 build.revision。
 */
def revisionProvider = providers.gradleProperty('build.revision')
if (!revisionProvider.isPresent()) {
    throw new GradleException("Missing Gradle property 'build.revision'.")
}
def revision = revisionProvider.get()

/*
 * Java 平台配置。
 * 作用：将 root 项目作为 BOM 平台使用，并允许声明平台依赖。
 */
javaPlatform {
    allowDependencies()
}

group = 'org.zero'
version = revision
description = 'Common Project'
def libsCatalog = extensions.getByType(VersionCatalogsExtension).named('libs')

