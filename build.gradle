// 所有项目通用配置（包括根项目）
allprojects {
    apply plugin: 'base'
//    apply plugin: 'io.spring.dependency-management'

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public/' }
        mavenCentral()
        mavenLocal{
            content {
                includeGroup("org.zero")
            }
        }
    }
}

// 所有子项目通用配置
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'application'
    apply plugin: 'jvm-test-suite'
    apply plugin: 'maven-publish'
    apply plugin: 'org.zero.plugin.source.source-jar'

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }

    // https://docs.gradle.org/current/userguide/java_plugin.html#java_plugin
    plugins.withId('java') {
        tasks.named('compileJava', JavaCompile) {
            options.compilerArgs += ["-parameters"]
            options.encoding = "UTF-8"
        }
        tasks.named('compileTestJava', JavaCompile) {
            options.compilerArgs += ["-parameters"]
            options.encoding = "UTF-8"
        }
        tasks.named('javadoc', Javadoc) {
            failOnError = false
            options.addStringOption('Xdoclint:none', '-quiet')
            options.encoding = "UTF-8"
        }
    }

    // https://docs.gradle.org/current/userguide/base_plugin.html#base_plugin
    plugins.withId('base') {
        tasks.named('clean', Delete) {
            followSymlinks = true
            doFirst {
                println "Cleaning..."
            }
        }
    }

//    tasks.named('sourcesJar', Jar) {
//        doFirst {
//            println "Generating sourcesJar..."
//        }
//    }
//    tasks.named('javadocJar', Jar) {
//        doFirst {
//            println "Generating javadocJar..."
//        }
//    }

    test {
//        enabled = false
        useJUnitPlatform()
        filter {
            includeTestsMatching("*Test")
            includeTestsMatching("*Tests")
            includeTestsMatching("*Spec")
        }
        testLogging {
            showStandardStreams = true
            events("passed", "skipped", "failed")
        }
    }
}

group = "org.zero"
version = libs.versions.revison
description = "Common Project"

wrapper {
    gradleVersion = "8.14.3"
    distributionType = Wrapper.DistributionType.ALL
}