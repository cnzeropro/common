name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        id: java8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up JDK 11
        id: java11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up JDK 17
        id: java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Export toolchain variables
        run: |
          echo "JAVA_HOME=${{ steps.java8.outputs.path }}" >> "$GITHUB_ENV"
          echo "JDK11_HOME=${{ steps.java11.outputs.path }}" >> "$GITHUB_ENV"
          echo "JDK17_HOME=${{ steps.java17.outputs.path }}" >> "$GITHUB_ENV"
          echo "JDK21_HOME=${{ steps.java21.outputs.path }}" >> "$GITHUB_ENV"
          echo "JDK25_HOME=${{ steps.java25.outputs.path }}" >> "$GITHUB_ENV"

      - name: Cache Gradle and Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-java-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/pom.xml', 'metadata/build-metadata.toml') }}
          restore-keys: |
            ${{ runner.os }}-java-

      - name: Run repository verification
        run: |
          chmod +x ./gradlew ./mvnw ./scripts/metadata/*.sh ./scripts/metadata/internal/*.sh ./scripts/ci/*.sh
          ./scripts/ci/verify.sh

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/**
          if-no-files-found: ignore
