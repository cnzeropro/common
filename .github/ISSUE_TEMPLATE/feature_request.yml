name: Feature Request
description: 提交新功能、兼容性增强或工程治理建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        在提交功能建议前，请确认该提议是否会影响：

        - Java 8 主线兼容性
        - Spring Boot 2 / 3 双栈适配
        - Gradle / Maven 双边元数据
  - type: input
    id: module
    attributes:
      label: 目标模块
      placeholder: core-base
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 使用场景
      description: 说明当前痛点、业务背景或工程背景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 说明建议的行为、接口或配置方式
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: 兼容性影响
      options:
        - 无破坏性影响
        - 可能影响 Java 8
        - 可能影响 Spring Boot 2 / 3
        - 可能影响 Maven / Gradle 元数据
        - 暂不确定
    validations:
      required: true
  - type: dropdown
    id: dependency_change
    attributes:
      label: 是否涉及新依赖
      options:
        - No
        - Yes
        - Not sure / 不确定
    validations:
      required: true
  - type: textarea
    id: api_change
    attributes:
      label: 预期 API 或配置变化
      description: 如涉及 DTO、公共方法、构建脚本、adapter，请写明影响
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
