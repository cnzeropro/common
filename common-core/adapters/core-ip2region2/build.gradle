import org.gradle.api.artifacts.VersionCatalogsExtension

plugins {
    id 'org.zero.conventions.java8-library'
}

def baseCatalog = extensions.getByType(VersionCatalogsExtension).named('baseLibs')

def requiredBaseLibrary = { String alias ->
    baseCatalog.findLibrary(alias).orElseThrow {
        new GradleException("Missing catalog alias '${alias}'.")
    }.get()
}

/*
 * 依赖布局。
 * 作用：`ip2region2` 适配层非常薄，只在根平台之上补核心模块与查询库依赖。
 */
dependencies {
    implementation(platform(project(':')))
    implementation(project(':core-base'))
    implementation(requiredBaseLibrary('org-lionsoul_ip2region'))

    /*
     * Lombok 编译支持。
     * 作用：适配层源码继续沿用统一注解处理策略。
     */
    compileOnly('org.projectlombok:lombok')
    annotationProcessor(requiredBaseLibrary('org-projectlombok_lombok'))
    testCompileOnly('org.projectlombok:lombok')
    testAnnotationProcessor(requiredBaseLibrary('org-projectlombok_lombok'))
}

description = 'common-core::ip2region2'
