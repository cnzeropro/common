plugins {
    id 'org.zero.conventions.java8-library'
}

/*
 * dependency layout - ip2region2 适配层非常薄，只在根平台之上补核心模块与查询库依赖。
 */
dependencies {
    implementation(platform(project(':')))
    implementation(project(':core-base'))
    implementation(libs.org.lionsoul.ip2region)

    /*
     * Lombok compile support - 适配层源码继续沿用统一注解处理策略。
     */
    compileOnly('org.projectlombok:lombok')
    annotationProcessor(libs.org.projectlombok.lombok)
    testCompileOnly('org.projectlombok:lombok')
    testAnnotationProcessor(libs.org.projectlombok.lombok)
}

description = 'common-core::ip2region2'
