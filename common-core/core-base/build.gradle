plugins {
    id 'org.zero.conventions.multi-release-java8'
}

/*
 * Catalog 回退。
 * 作用：个别坐标暂未进入当前 catalog 时保留稳定 fallback，避免历史构建直接失效。
 */
def libsCatalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
def sentinelWebMvcDependency = libsCatalog.findLibrary('com-alibaba-csp_sentinel-spring-webmvc-adapter').orElse(null)
    ?: 'com.alibaba.csp:sentinel-spring-webmvc-adapter:1.8.8'

/*
 * 依赖布局。
 * 作用：`core-base` 统一复用根平台约束，并按当前 profile 选择实现与测试依赖。
 */
dependencies {
    implementation(platform(project(':')))
    implementation(project(':common-data'))
    implementation('org.springframework:spring-web')
    implementation('org.springframework:spring-webmvc')
    implementation('org.springframework:spring-webflux')
    implementation('org.springframework:spring-websocket')
    implementation('org.springframework:spring-context')
    implementation('org.springframework.boot:spring-boot-autoconfigure')
    implementation('org.springframework.data:spring-data-redis')
    implementation('org.springframework.data:spring-data-jpa')
    implementation('org.springframework:spring-jdbc')
    implementation('org.springframework.security:spring-security-core')
    implementation(libs.org.springframework.plugin.spring.plugin.metadata)
    implementation('org.springframework.cloud:spring-cloud-gateway-server')
    implementation('org.springframework.cloud:spring-cloud-loadbalancer')
    implementation('org.springframework.cloud:spring-cloud-openfeign-core')
    implementation('org.apache.dubbo:dubbo')
    implementation('org.apache.shiro:shiro-core')
    implementation(libs.org.apache.maven.maven.model)
    implementation(libs.org.apache.poi.poi.ooxml)
    implementation(libs.org.apache.commons.commons.text)
    implementation(libs.org.apache.commons.commons.compress)
    implementation('org.apache.logging.log4j:log4j-core')
    implementation('org.aspectj:aspectjrt')
    implementation('org.quartz-scheduler:quartz')
    implementation('org.hibernate:hibernate-core')
    implementation(libs.org.redisson.redisson)
    implementation(libs.org.lionsoul.ip2region)
    implementation(libs.org.openjdk.jol.jol.core)
    implementation('org.slf4j:slf4j-api')
    implementation('com.alibaba:transmittable-thread-local')
    implementation(libs.com.alibaba.easyexcel)
    implementation('com.alibaba.fastjson2:fastjson2')
    implementation('com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel')
    implementation('com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery')

    /*
     * Sentinel 适配器回退。
     * 作用：优先使用 catalog 别名，缺项时回退到历史稳定版本。
     */
    implementation(sentinelWebMvcDependency)
    implementation('com.alibaba.csp:sentinel-parameter-flow-control')
    implementation(libs.com.alibaba.csp.sentinel.apache.dubbo.adapter)
    implementation(libs.com.alibaba.csp.sentinel.apache.dubbo3.adapter)
    implementation('com.fasterxml.jackson.core:jackson-databind')
    implementation('com.fasterxml.jackson.datatype:jackson-datatype-jsr310')
    implementation('com.fasterxml.jackson.dataformat:jackson-dataformat-xml')
    implementation('com.google.guava:guava')
    implementation('com.google.code.gson:gson')
    implementation(libs.com.googlecode.juniversalchardet.juniversalchardet)
    implementation(libs.com.github.rholder.guava.retrying)
    implementation(libs.com.github.ben.manes.caffeine.caffeine)
    implementation(libs.com.github.ulisesbocchio.jasypt.spring.boot)
    implementation('com.baomidou:mybatis-plus-core')
    implementation('com.baomidou:mybatis-plus-generator')
    implementation('com.mybatis-flex:mybatis-flex-core')
    runtimeOnly('com.mysql:mysql-connector-j')
    runtimeOnly('org.postgresql:postgresql')
    runtimeOnly('com.oracle.database.jdbc:ojdbc8')
    implementation(libs.com.esotericsoftware.kryo)
    implementation(libs.com.auth0.java.jwt)
    implementation('cn.hutool:hutool-core')
    implementation('cn.hutool:hutool-poi')
    implementation('cn.hutool:hutool-http')
    implementation('cn.hutool:hutool-json')
    implementation('cn.hutool:hutool-extra')
    implementation('cn.hutool:hutool-crypto')
    implementation('io.github.openfeign:feign-core')
    implementation(libs.io.minio.minio)
    implementation('io.jsonwebtoken:jjwt-api')
    testImplementation('io.jsonwebtoken:jjwt-impl')
    testImplementation('io.jsonwebtoken:jjwt-jackson')
    testImplementation('org.springframework.security:spring-security-oauth2-core')
    implementation('ch.qos.logback:logback-classic')
    implementation('javax.servlet:javax.servlet-api')
    implementation(libs.javax.servlet.servlet.api)
    implementation('javax.validation:validation-api')
    implementation('javax.annotation:javax.annotation-api')
    implementation('javax.websocket:javax.websocket-api')
    implementation('javax.mail:javax.mail-api')
    implementation('jakarta.servlet:jakarta.servlet-api')
    implementation('jakarta.validation:jakarta.validation-api')
    implementation('jakarta.websocket:jakarta.websocket-api')
    implementation('jakarta.annotation:jakarta.annotation-api')
    implementation('jakarta.mail:jakarta.mail-api')
    implementation(libs.xerces.xercesImpl)

    /*
     * Lombok 编译支持。
     * 作用：主线源码和测试都只在编译期启用注解处理。
     */
    compileOnly('org.projectlombok:lombok')
    annotationProcessor(libs.org.projectlombok.lombok)
    testCompileOnly('org.projectlombok:lombok')
    testAnnotationProcessor(libs.org.projectlombok.lombok)
}

description = 'common-core::base'
