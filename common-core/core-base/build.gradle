plugins {
    id 'org.zero.conventions.multi-release-java8'
}

def baseCatalog = extensions.getByType(VersionCatalogsExtension).named('baseLibs')
def sourceSets = extensions.getByType(SourceSetContainer)
def toolchains = extensions.getByType(JavaToolchainService)
def mainSourceSet = sourceSets.named(SourceSet.MAIN_SOURCE_SET_NAME).get()
def aspectSourceDirectory = file('src/main/aspect')
def compileJavaTask = tasks.named('compileJava', JavaCompile)
def mainResourcesDirectory = layout.buildDirectory.dir('resources/main')
def compileAspectjArgumentsFile = layout.buildDirectory.file('tmp/aspectj/compileAspectj.args')
def aspectClassesDirectory = layout.buildDirectory.dir('classes/aspectj/main')
def aspectjVersion = baseCatalog.findVersion('org-aspectj_aspectjrt')
    .orElseThrow { new GradleException("Missing catalog version 'org-aspectj_aspectjrt'.") }
    .requiredVersion

configurations {
    aspectjTools {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
}

configurations.configureEach { configuration ->
    if (!configuration.canBeResolved) {
        return
    }
    configuration.resolutionStrategy.force(
        "org.aspectj:aspectjrt:${aspectjVersion}",
        "org.aspectj:aspectjtools:${aspectjVersion}",
        "org.aspectj:aspectjweaver:${aspectjVersion}"
    )
}

def requiredBaseLibrary = { String alias ->
    baseCatalog.findLibrary(alias).orElseThrow {
        new GradleException("Missing catalog alias '${alias}'.")
    }.get()
}

