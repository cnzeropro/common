def compileAspectj = tasks.register('compileAspectj', JavaExec) { task ->
    task.group = 'build'
    task.description = 'Compile AspectJ sources from src/main/aspect into the main output directory.'
    task.classpath = configurations.aspectjTools
    task.mainClass.set('org.aspectj.tools.ajc.Main')
    task.javaLauncher.set(toolchains.launcherFor(spec -> spec.getLanguageVersion().set(JavaLanguageVersion.of(17))))
    task.notCompatibleWithConfigurationCache('AspectJ compile arguments are generated dynamically for Windows command length limits.')
    task.dependsOn(compileJavaTask, tasks.named('processResources'))
    task.inputs.files(fileTree(aspectSourceDirectory) {
        include('**/*.aj')
    })
    task.inputs.files(mainSourceSet.getCompileClasspath(), compileJavaTask.flatMap { it.destinationDirectory }, mainResourcesDirectory)
    task.outputs.dir(aspectClassesDirectory)
    task.outputs.file(compileAspectjArgumentsFile)
    task.onlyIf {
        aspectSourceDirectory.isDirectory() && !fileTree(aspectSourceDirectory).matching {
            include('**/*.aj')
        }.isEmpty()
    }
    task.doFirst {
        List<String> aspectFiles = fileTree(aspectSourceDirectory).matching {
            include('**/*.aj')
        }.files.collect { File file -> file.absolutePath }.sort()
        File argsFile = compileAspectjArgumentsFile.get().asFile
        argsFile.parentFile.mkdirs()
        List<String> arguments = [
            '-1.8',
            '-encoding', 'UTF-8',
            '-showWeaveInfo',
            '-classpath', files(mainSourceSet.getCompileClasspath(), compileJavaTask.get().destinationDirectory, mainResourcesDirectory).asPath,
            '-d', aspectClassesDirectory.get().asFile.absolutePath
        ] + aspectFiles
        argsFile.setText(arguments.join(System.lineSeparator()), 'UTF-8')
        task.args = ['-argfile', argsFile.absolutePath]
    }
}

tasks.named('classes') {
    dependsOn(compileAspectj)
}

mainSourceSet.output.dir(aspectClassesDirectory, builtBy: compileAspectj)

tasks.named('compileTestJava') {
    dependsOn(compileAspectj)
}

tasks.named('sourcesJar', Jar) {
    from(aspectSourceDirectory) {
        include('**/*.aj')
    }
}

dependencies {
    aspectjTools(requiredBaseLibrary('org-aspectj_aspectjtools'))
}

description = 'common-core::base'
