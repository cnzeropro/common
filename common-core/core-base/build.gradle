import org.gradle.api.artifacts.VersionCatalogsExtension

plugins {
    id 'org.zero.conventions.multi-release-java8'
}

def baseCatalog = extensions.getByType(VersionCatalogsExtension).named('baseLibs')

def requiredBaseLibrary = { String alias ->
    baseCatalog.findLibrary(alias).orElseThrow {
        new GradleException("Missing catalog alias '${alias}'.")
    }.get()
}

/*
 * Catalog 回退。
 * 作用：个别坐标暂未进入当前 catalog 时保留稳定 fallback，避免历史构建直接失效。
 */
/*
 * 依赖布局。
 * 作用：`core-base` 统一复用根平台约束，并按当前 profile 选择实现与测试依赖。
 */
dependencies {
    implementation(platform(project(':')))
    implementation(project(':common-data'))
    implementation('org.springframework:spring-web')
    implementation('org.springframework:spring-webmvc')
    implementation('org.springframework:spring-webflux')
    implementation('org.springframework:spring-websocket')
    implementation('org.springframework:spring-context')
    implementation('org.springframework.boot:spring-boot-autoconfigure')
    implementation('org.springframework.data:spring-data-redis')
    implementation('org.springframework.data:spring-data-jpa')
    implementation('org.springframework:spring-jdbc')
    implementation('org.springframework.security:spring-security-core')
    implementation(requiredBaseLibrary('org-springframework-plugin_spring-plugin-metadata'))
    implementation('org.springframework.cloud:spring-cloud-gateway-server')
    implementation('org.springframework.cloud:spring-cloud-loadbalancer')
    implementation('org.springframework.cloud:spring-cloud-openfeign-core')
    implementation('org.apache.dubbo:dubbo')
    implementation('org.apache.shiro:shiro-core')
    implementation(requiredBaseLibrary('org-apache-maven_maven-model'))
    implementation(requiredBaseLibrary('org-apache-poi_poi-ooxml'))
