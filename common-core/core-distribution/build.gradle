import org.gradle.api.file.DuplicatesStrategy
import org.gradle.api.tasks.bundling.Jar
import org.zero.build.BuildProfileSupport

plugins {
    id 'org.zero.conventions.aggregate-distribution'
}

/*
 * Profile 桥接。
 * 作用：聚合分发模块读取根工程解析出的 profile，决定是否纳入高版本适配层。
 */
def activeBuildProfile = BuildProfileSupport.resolveProfile(project, findProperty('buildProfile'))

/*
 * 聚合模块列表。
 * 作用：Java 8 基线始终参与，Jakarta 与 Boot 3 适配层仅在高版本 profile 下并入。
 */
def aggregatedProjects = [
    project(':core-base'),
    project(':core-ip2region2')
]
if (BuildProfileSupport.isAtLeast(project, activeBuildProfile, 'java17')) {
    aggregatedProjects.add(project(':core-jakarta'))
    aggregatedProjects.add(project(':core-spring-boot3'))
}

/*
 * 聚合主 Jar。
 * 作用：当前模块不编译源码，只把被聚合模块的 `main` 输出合并进同一个 jar。
 */
tasks.named('jar', Jar) {
    aggregatedProjects.each { Project dependencyProject ->
        dependsOn(dependencyProject.tasks.named('classes'))
        from(dependencyProject.extensions.getByType(org.gradle.api.tasks.SourceSetContainer).getByName('main').output)
    }
}

/*
 * 聚合源码附件。
 * 作用：`sourcesJar` 合并被聚合模块的源码附件，避免发布空归档。
 */
tasks.named('sourcesJar', Jar) {
    enabled = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    aggregatedProjects.each { Project dependencyProject ->
        def sourceJarTask = dependencyProject.tasks.named('sourcesJar', Jar)
        dependsOn(sourceJarTask)
        from({
            zipTree(sourceJarTask.get().archiveFile.get().asFile)
        })
    }
}

/*
 * 聚合 Javadoc 附件。
 * 作用：`javadocJar` 合并被聚合模块的文档附件，保持发布语义一致。
 */
tasks.named('javadocJar', Jar) {
    enabled = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    aggregatedProjects.each { Project dependencyProject ->
        def javadocJarTask = dependencyProject.tasks.named('javadocJar', Jar)
        dependsOn(javadocJarTask)
        from({
            zipTree(javadocJarTask.get().archiveFile.get().asFile)
        })
    }
}

description = 'common-core::distribution'
