import org.gradle.api.file.DuplicatesStrategy
import org.gradle.api.tasks.testing.Test

plugins {
    id('java-gradle-plugin')
}

/*
 * 插件仓库。
 * 作用：解析 Gradle API、测试依赖和自定义 plugin 的发布依赖。
 */
repositories {
    mavenCentral()
    gradlePluginPortal()
}

/*
 * Java 基线。
 * 作用：`build-logic` 自身保持 Java 8 兼容，便于主仓库在低版本 JDK 环境下编译插件代码。
 */
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

/*
 * 测试源码集。
 * 作用：复用 `scripts/build-metadata` 的源码与测试，确保元数据逻辑和 `build-logic` 侧验证保持一致。
 */
sourceSets {
    test {
        java {
            srcDir('../scripts/build-metadata/src/main/java')
            srcDir('../scripts/build-metadata/src/test/java')
        }
    }
}

dependencies {
    implementation(gradleApi())
    testImplementation(gradleTestKit())
    testImplementation(platform(libs.org.junit.junit.bom))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

/*
 * 插件注册。
 * 作用：集中声明根仓库使用的 convention plugin 入口实现类。
 */
gradlePlugin {
    plugins {
        java8LibraryConvention {
            id = 'org.zero.conventions.java8-library'
            implementationClass = 'org.zero.plugin.convention.Java8LibraryConventionPlugin'
        }
        java8ApplicationConvention {
            id = 'org.zero.conventions.java8-application'
            implementationClass = 'org.zero.plugin.convention.Java8ApplicationConventionPlugin'
        }
        java17ApplicationConvention {
            id = 'org.zero.conventions.java17-application'
            implementationClass = 'org.zero.plugin.convention.Java17ApplicationConventionPlugin'
        }
        java17LibraryConvention {
            id = 'org.zero.conventions.java17-library'
            implementationClass = 'org.zero.plugin.convention.Java17LibraryConventionPlugin'
        }
        multiReleaseJava8Convention {
            id = 'org.zero.conventions.multi-release-java8'
            implementationClass = 'org.zero.plugin.convention.MultiReleaseJava8ConventionPlugin'
        }
        aggregateDistributionConvention {
            id = 'org.zero.conventions.aggregate-distribution'
            implementationClass = 'org.zero.plugin.convention.AggregateDistributionConventionPlugin'
        }
        sitePublishConvention {
            id = 'org.zero.conventions.site-publish'
            implementationClass = 'org.zero.plugin.convention.SitePublishConventionPlugin'
        }
    }
}

/*
 * Groovy 编译禁用。
 * 作用：当前实现已迁移到 `src/main/java`，关闭 Groovy 编译避免同名类重复打包。
 */
tasks.matching { it.name == 'compileGroovy' || it.name == 'compileTestGroovy' }.configureEach {
    enabled = false
}

/*
 * 插件描述合并。
 * 作用：允许 descriptor 在 `processResources` 阶段并入资源，并在 `jar` 阶段统一排重。
 */
tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def skipBuildLogicTests = providers.gradleProperty('buildLogic.skipTests')
def skipLegacyBuildSrcTests = providers.gradleProperty('buildSrc.skipTests')

/*
 * 测试开关。
 * 作用：支持通过 `-PbuildLogic.skipTests` 跳过自测，并兼容历史属性 `-PbuildSrc.skipTests`。
 */
tasks.named('test', Test).configure {
    useJUnitPlatform()
    onlyIf { !skipBuildLogicTests.isPresent() && !skipLegacyBuildSrcTests.isPresent() }
}
